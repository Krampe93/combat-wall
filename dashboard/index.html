<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Combat Wall</title>
  <link rel="stylesheet" href="dashboard-0.7.2.css?v=0.7.2">
</head>
<body>
  <main id="app" class="app waiting">
    <header class="topbar">
      <section id="current-panel" class="current-panel empty">
        <div class="current-image-wrap">
          <img id="current-image" class="current-image" alt="Aktiver Teilnehmer">
        </div>
        <div class="current-copy">
          <p class="eyebrow">Aktuell am Zug</p>
          <h1 id="current-name">Noch kein aktiver Zug</h1>
          <p id="current-meta" class="current-meta">Warte auf Foundry …</p>
          <div id="current-statuses" class="status-row"></div>
        </div>
      </section>

      <section class="order-panel">
        <div class="order-heading">
          <div>
            <p class="eyebrow">Zugreihenfolge</p>
            <h2 id="round-label">Kein aktiver Kampf</h2>
          </div>
          <div class="toolbar">
            <span id="connection-indicator" class="connection-indicator waiting">Warte auf Daten</span>
            <button id="refresh-button" type="button">Neu laden</button>
            <button id="fullscreen-button" type="button">Vollbild</button>
          </div>
        </div>
        <div id="initiative-strip" class="initiative-strip"></div>
      </section>
    </header>

    <section id="empty-state" class="empty-state">
      <h2 id="empty-title">Combat Wall wartet auf Foundry</h2>
      <p id="empty-copy">Öffne diese Seite über den Combat-Wall-Knopf in deiner Foundry-Welt.</p>
    </section>

    <section id="groups-grid" class="groups-grid" aria-live="polite" data-layout-mode="overview"></section>

    <details id="debug-panel" class="debug-panel" hidden>
      <summary>Debug-Daten</summary>
      <pre id="debug-output">Noch keine Daten empfangen.</pre>
    </details>
  </main>

  <script src="dashboard-0.7.2.js?v=0.7.2"></script>
</body>
</html>
